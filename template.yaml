AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Forwarding app API (Express di Lambda + API Gateway HTTP API)

Parameters:
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
  CorsOrigin:
    Type: String
    Default: ''
    Description: Origin frontend, pisahkan dengan koma

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.handler
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SSL: 'true'
          DB_POOL_MAX: '2'
          JWT_SECRET: !Ref JwtSecret
          CORS_ORIGIN: !Ref CorsOrigin
      Events:
        Http:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: URL API Gateway
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
